[package]
name = "build-borders"
version = "0.1.0"
edition = "2024"
publish = false
description = "Turns county-level boundary files into one PMTiles vector tile archive for the radar maps."

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
